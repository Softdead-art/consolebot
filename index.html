<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Мастерская</title>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #17212b);
    --bg2: var(--tg-theme-secondary-bg-color, #232e3c);
    --text: var(--tg-theme-text-color, #f5f5f5);
    --hint: var(--tg-theme-hint-color, #8b9aa7);
    --accent: var(--tg-theme-button-color, #3a8ee6);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --ok: #3fb950;
    --bad: #f85149;
    --warn: #e3b341;
    --pcb: #1f5f3a;
    --pcb2: #2a7a4b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding: 12px 16px 24px; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  h1 { font-size: 17px; margin: 0 0 2px; }
  .sub { color: var(--hint); font-size: 13px; }
  .steps { display: flex; gap: 6px; margin: 10px 0 12px; }
  .steps span { flex: 1; height: 6px; border-radius: 3px; background: var(--bg2); }
  .steps span.ok { background: var(--ok); } .steps span.bad { background: var(--bad); }
  .steps span.cur { background: var(--accent); }
  .card { background: var(--bg2); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
  .title { font-weight: 600; font-size: 16px; margin-bottom: 4px; }
  .info { font-size: 14px; }
  .info b { color: var(--accent); }
  .status { min-height: 20px; line-height: 20px; font-size: 13px; text-align: center; color: var(--hint);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
  .status b { color: var(--text); }
  .timer { height: 4px; border-radius: 2px; background: var(--bg2); margin: 8px 0; overflow: hidden; }
  .timer i { display: block; height: 100%; width: 100%; background: var(--warn); transform-origin: left; }
  .board { position: relative; width: 100%; max-width: 420px; aspect-ratio: 1 / 1; margin: 0 auto 10px;
    border-radius: 16px; background: radial-gradient(circle at 30% 20%, var(--pcb2), var(--pcb));
    overflow: hidden; touch-action: none; box-shadow: inset 0 0 0 2px rgba(255,255,255,.06); }
  @supports not (aspect-ratio: 1 / 1) { .board { height: min(92vw, 420px); } }
  .board.lid { background: linear-gradient(145deg, #3b3f46, #24272c); }
  .abs { position: absolute; transform: translate(-50%, -50%); }
  .btn { display: block; width: 100%; padding: 13px; border: 0; border-radius: 12px; font-size: 16px;
    font-weight: 600; background: var(--accent); color: var(--accent-text); margin-top: 8px; touch-action: none; }
  .btn.alt { background: var(--bg2); color: var(--text); }
  .btn:disabled { opacity: .5; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row .btn { flex: 1 1 40%; }
  .screw { width: 44px; height: 44px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #d9dde3, #7d848f);
    box-shadow: 0 2px 4px rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: #222; font-size: 15px; }
  .screw::after { content: ""; position: absolute; width: 22px; height: 4px; background: #444; border-radius: 2px;
    transform: rotate(var(--rot, 0deg)); opacity: .55; }
  .screw.done { opacity: 0; transition: opacity .3s, transform .3s; transform: translate(-50%, -50%) scale(.3); }
  .dust { width: 38px; height: 38px; border-radius: 50%; background: radial-gradient(circle, rgba(160,150,135,.95), rgba(120,110,95,.5) 60%, transparent 72%);
    pointer-events: none; transition: opacity .25s, transform .25s; }
  .dust.gone { opacity: 0; transform: translate(-50%, -50%) scale(1.8); }
  .chip { position: absolute; left: 20%; top: 20%; width: 60%; height: 60%; background: #1d1d1f; border-radius: 6px;
    box-shadow: 0 0 0 3px #555, 0 4px 10px rgba(0,0,0,.6); }
  .grid { position: absolute; inset: 0; display: grid; }
  .cell { pointer-events: none; }
  .cell.oldpaste { background: #9a9a8e; } .cell.clean { background: transparent; }
  .cell.paste { background: #c9cdd2; } .cell.spill { background: rgba(201,205,210,.85); }
  .slot { width: 18%; height: 22%; border: 2px dashed rgba(255,255,255,.5); border-radius: 8px; display: flex;
    align-items: flex-end; justify-content: center; font-size: 13px; padding-bottom: 4px; }
  .slot.filled { border-style: solid; }
  .wire { padding: 12px; border-radius: 10px; font-weight: 700; color: #111; text-align: center; flex: 1 1 40%; border: 0; font-size: 15px; }
  .offer { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-radius: 12px;
    background: var(--bg); margin-top: 8px; font-family: ui-monospace, Menlo, monospace; font-size: 15px; border: 2px solid transparent; }
  .offer small { color: var(--hint); font-family: inherit; }
  .tag { display: inline-block; font-family: ui-monospace, Menlo, monospace; background: #f3f0e0; color: #222;
    padding: 6px 10px; border-radius: 6px; font-weight: 700; letter-spacing: 1px; }
  .socket { width: 34%; height: 14%; background: #f0f0f0; color: #222; border-radius: 6px; display: flex;
    align-items: center; justify-content: center; font-weight: 700; font-size: 14px; box-shadow: 0 2px 0 #999; }
  .gauge { position: absolute; left: 12%; top: 8%; width: 16%; height: 84%; background: #111; border-radius: 10px; overflow: hidden; }
  .gauge .band { position: absolute; left: 0; right: 0; background: rgba(63,185,80,.45); }
  .gauge .red { position: absolute; left: 0; right: 0; height: 3px; background: var(--bad); }
  .gauge .fill { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(0deg, #f0883e, #f85149); }
  .bigtemp { position: absolute; left: 62%; top: 40%; font-size: 40px; font-weight: 800; transform: translate(-50%, -50%); }
  .pin { width: 13%; height: 30%; background: linear-gradient(#c9a227, #8a6d12); border-radius: 4px; }
  .pin.good { background: linear-gradient(#e8e8e8, #a9a9a9); box-shadow: 0 0 8px #fff; }
  .pin.bad { background: linear-gradient(#5a3a1a, #2a1a0a); }
  .pin .pr { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.55); }
  .pin .zone { position: absolute; left: -6px; right: -6px; height: 2px; background: var(--ok); }
  .point { width: 64px; height: 64px; border-radius: 50%; background: #c0392b; border: 4px solid #eee; color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; text-align: center; }
  .reading { font-family: ui-monospace, Menlo, monospace; font-size: 13px; background: #000; color: #7CFC00;
    padding: 3px 6px; border-radius: 4px; }
  .nand { position: absolute; left: 22%; top: 18%; width: 56%; height: 64%; background: #111; border-radius: 6px; }
  .npin { width: 15%; height: 9%; background: #c0c0c0; color: #111; font-size: 11px; font-weight: 700; display: flex;
    align-items: center; justify-content: center; border-radius: 2px; }
  .npin.on { background: var(--ok); }
  .bar { position: relative; height: 46px; border-radius: 10px; background: #111; overflow: hidden; margin: 14px 0; }
  .bar .win { position: absolute; top: 0; bottom: 0; background: rgba(63,185,80,.55); }
  .bar .mark { position: absolute; top: 0; bottom: 0; width: 4px; background: #fff; }
  .toast { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); padding: 16px 22px; border-radius: 14px;
    font-weight: 700; font-size: 18px; color: #fff; z-index: 10; text-align: center; max-width: 85%; }
  .toast.ok { background: rgba(46,160,67,.95); } .toast.bad { background: rgba(218,54,51,.95); }
  .hidden { display: none !important; }
  /* ---- новые мини-игры ---- */
  .spot { width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(circle, #5fbf6a, #2f7d3a 60%, transparent 72%);
    pointer-events: none; transition: opacity .2s; }
  .slider { width: 100%; height: 44px; margin-top: 10px; }
  .meter { position: absolute; left: 8%; right: 8%; height: 18px; border-radius: 9px; background: #111; overflow: hidden; }
  .meter i { position: absolute; left: 0; top: 0; bottom: 0; background: #3a8ee6; }
  .ring { width: 46%; aspect-ratio: 1; border-radius: 50%; border: 3px dashed rgba(255,255,255,.35); }
  .ring.in { border-color: var(--ok); }
  .knob { width: 14%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #666, #111);
    box-shadow: 0 0 0 4px #333; pointer-events: none; }
  .crack { position: absolute; inset: 0; pointer-events: none; }
  .fuse { width: 18%; height: 30%; border-radius: 8px; background: linear-gradient(90deg, #ccc, #fff 40%, #ccc);
    display: flex; align-items: flex-end; justify-content: center; font-weight: 700; color: #222; padding-bottom: 4px; }
  .fuse.beep { box-shadow: 0 0 0 4px var(--ok); } .fuse.mute { box-shadow: 0 0 0 4px var(--bad); }
  /* ---- площадка запчастей ---- */
  .shopcard { background: var(--bg); border-radius: 12px; padding: 12px; margin-top: 8px; border: 2px solid transparent; }
  .shopcard b { font-size: 16px; } .shopcard .pros { color: var(--ok); font-size: 13px; } .shopcard .cons { color: var(--bad); font-size: 13px; }
  .rotate { text-align: center; padding: 40px 10px; font-size: 18px; }
  .rotate .phone { font-size: 64px; display: inline-block; animation: spin 2s ease-in-out infinite; }
  @keyframes spin { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(90deg); } }
  .mp { background: #f4f5f7; color: #1b1b1f; border-radius: 14px; overflow: hidden; margin: 0 -8px; }
  .mp-top { padding: 10px 12px; color: #fff; display: flex; gap: 10px; align-items: center; }
  .mp-top b { font-size: 17px; white-space: nowrap; }
  .mp-search { flex: 1; background: #fff; color: #888; border-radius: 8px; padding: 7px 10px; font-size: 13px; }
  .mp-tabs { display: flex; gap: 6px; overflow-x: auto; padding: 8px 10px; background: #fff; }
  .mp-tabs span { white-space: nowrap; padding: 6px 10px; border-radius: 16px; background: #eceef2; font-size: 13px; }
  .mp-tabs span.on { background: #1b1b1f; color: #fff; }
  .mp-need { padding: 8px 12px; font-size: 13px; background: #fff7d6; }
  .mp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; padding: 10px; }
  .mp-item { background: #fff; border-radius: 10px; padding: 8px; font-size: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .mp-item .em { font-size: 34px; text-align: center; padding: 6px 0; background: #f4f5f7; border-radius: 8px; }
  .mp-item .pr { font-weight: 800; font-size: 14px; margin-top: 4px; }
  .mp-item .nm { height: 32px; overflow: hidden; }
  .mp-page { padding: 14px; background: #fff; }
  .mp-page .em { font-size: 80px; text-align: center; background: #f4f5f7; border-radius: 12px; padding: 18px 0; }
  .mp-btn { display: block; width: 100%; border: 0; border-radius: 10px; padding: 13px; font-size: 16px; font-weight: 700;
    color: #fff; margin-top: 10px; }
  .iron { font-size: 15px; text-align: center; margin: 10px 0; }
  .switch { width: 64px; height: 34px; border-radius: 17px; background: #555; position: relative; display: inline-block; vertical-align: middle; }
  .switch i { position: absolute; top: 3px; left: 3px; width: 28px; height: 28px; border-radius: 50%; background: #fff; transition: left .2s; }
  .switch.on { background: var(--ok); } .switch.on i { left: 33px; }
  @media (orientation: landscape) and (max-height: 520px) {      /* телефон повёрнут — место под магазин */
    h1, #subhdr { display: none; } body { padding-top: 6px; } .steps { margin: 2px 0 6px; }
  }
  .center { text-align: center; }
</style>
</head>
<body>
<h1 id="hdr">🛠 Мастерская</h1>
<div class="sub" id="subhdr"></div>
<div class="steps" id="steps"></div>
<div id="stage"></div>

<script>
"use strict";
// ---------------------------------------------------------------- параметры из ссылки
const Q = new URLSearchParams(location.search);
const REP = Q.get("r") || "", KEY = Q.get("k") || "", SEED = parseInt(Q.get("s") || "0", 10) || 0;
const PLAN = (Q.get("p") || "").split(",").filter(Boolean).slice(0, 10);
// Своя маленькая связь с Telegram вместо telegram-web-app.js: сайт telegram.org бывает заблокирован,
// и тогда страница висела бы, пока не загрузится чужой скрипт.
const TG = (function () {
  const inTelegram = !!(window.TelegramWebviewProxy || (window.external && "notify" in window.external) ||
    window.parent !== window || /tgWebApp/.test(location.hash));
  function post(event, data) {
    try {
      if (window.TelegramWebviewProxy && window.TelegramWebviewProxy.postEvent) {
        window.TelegramWebviewProxy.postEvent(event, data === undefined ? "" : JSON.stringify(data)); return true;
      }
      if (window.external && "notify" in window.external) {
        window.external.notify(JSON.stringify({ eventType: event, eventData: data })); return true;
      }
      if (window.parent !== window) {
        window.parent.postMessage(JSON.stringify({ eventType: event, eventData: data }), "*"); return true;
      }
    } catch (e) { /* не в Telegram */ }
    return false;
  }
  // цвета темы Telegram приходят в адресе после «#»
  try {
    const h = new URLSearchParams(location.hash.slice(1)).get("tgWebAppThemeParams");
    if (h) {
      const theme = JSON.parse(h);
      for (const k in theme) if (/^[a-z_]+$/.test(k) && /^#[0-9a-fA-F]{3,8}$/.test(theme[k]))
        document.documentElement.style.setProperty("--tg-theme-" + k.replace(/_/g, "-"), theme[k]);
    }
  } catch (e) { /* без темы */ }
  if (!inTelegram) return null;
  return {
    ready() { post("web_app_ready"); },
    expand() { post("web_app_expand"); },
    close() { post("web_app_close"); },
    openTelegramLink(url) {
      const u = new URL(url);
      if (!post("web_app_open_tg_link", { path_full: u.pathname + u.search })) location.href = url;
    },
    HapticFeedback: {
      impactOccurred(style) { post("web_app_trigger_haptic_feedback", { type: "impact", impact_style: style }); },
      notificationOccurred(type) { post("web_app_trigger_haptic_feedback", { type: "notification", notification_type: type }); },
    },
  };
})();
const KINDS = {
  screws: "🪛 Разборка корпуса", dust: "💨 Чистка от пыли", fan: "🌀 Подключение кулера",
  oldpaste: "🧽 Снятие старой пасты", paste: "🧴 Новая термопаста", part: "🛒 Заказ детали",
  ribbon: "🔌 Установка шлейфа", heat: "🔥 Прогрев феном", solder: "🧑‍🏭 Пайка контактов",
  measure: "📟 Замеры мультиметром", probe: "🔗 Подключение программатора", flash: "💾 Запись NAND",
  test: "✅ Финальная проверка", shop: "🛒 Покупка запчасти", corrosion: "🧪 Чистка окислов", dry: "🌬 Сушка платы",
  calib: "🎯 Калибровка стика", pry: "🔋 Снятие аккумулятора", glue: "🧴 Склейка корпуса",
  continuity: "🔊 Прозвонка предохранителей",
};

// ---------------------------------------------------------------- случайность с зерном (одинаковые задания при повторном открытии)
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function makeRnd(seed) {
  const r = mulberry32(seed);
  return {
    f: r,
    int: (a, b) => a + Math.floor(r() * (b - a + 1)),
    pick: arr => arr[Math.floor(r() * arr.length)],
    shuffle: arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
    sample: (arr, n) => makeRnd(Math.floor(r() * 2 ** 31)).shuffle(arr).slice(0, n),
  };
}

// ---------------------------------------------------------------- хранилище прогресса (нельзя переиграть проваленный этап)
const store = {
  key: `rep_${REP}_${SEED}`,
  load() {
    try { return Promise.resolve(JSON.parse(localStorage.getItem(this.key) || "null")); }
    catch (e) { return Promise.resolve(null); }
  },
  save(v) {
    try { localStorage.setItem(this.key, JSON.stringify(v)); } catch (e) { /* приватный режим */ }
  },
};

// ---------------------------------------------------------------- мелочи интерфейса
const $stage = document.getElementById("stage");
function el(tag, cls, parent, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  if (parent) parent.appendChild(e);
  return e;
}
function at(e, x, y) { e.style.left = x + "%"; e.style.top = y + "%"; return e; }
function haptic(kind) {
  try {
    if (!TG || !TG.HapticFeedback) return;
    if (kind === "ok" || kind === "bad") TG.HapticFeedback.notificationOccurred(kind === "ok" ? "success" : "error");
    else TG.HapticFeedback.impactOccurred(kind || "light");
  } catch (e) { /* старый клиент */ }
}
function toast(ok, text) {
  return new Promise(res => {
    haptic(ok ? "ok" : "bad");
    const t = el("div", "toast " + (ok ? "ok" : "bad"), document.body, text);
    setTimeout(() => { t.remove(); res(); }, 1300);
  });
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function point(e) { const p = e.touches ? e.touches[0] : e; return { x: p.clientX, y: p.clientY }; }
function hitAll(board, e, cls) {
  const p = point(e), out = [];
  for (const n of board.querySelectorAll("." + cls)) {
    const r = n.getBoundingClientRect(), pad = 8;
    if (p.x >= r.left - pad && p.x <= r.right + pad && p.y >= r.top - pad && p.y <= r.bottom + pad) out.push(n);
  }
  return out;
}
function swipe(board, onMove) {   // вызывает onMove(event) при движении пальца с зажатием
  let down = false;
  const start = e => { down = true; e.preventDefault(); onMove(e); };
  const move = e => { if (down) { e.preventDefault(); onMove(e); } };
  const stop = () => { down = false; };
  board.addEventListener("pointerdown", start); board.addEventListener("pointermove", move);
  window.addEventListener("pointerup", stop); window.addEventListener("pointercancel", stop);
}
function hold(btn, onDown, onUp) {
  const down = e => { e.preventDefault(); onDown(); };
  const up = () => onUp();
  btn.addEventListener("pointerdown", down);
  btn.addEventListener("pointerup", up); btn.addEventListener("pointerleave", up); btn.addEventListener("pointercancel", up);
  btn.addEventListener("contextmenu", e => e.preventDefault());
}

// Каркас этапа: заголовок, подсказка, таймер, поле
function frame(title, info, seconds) {
  $stage.innerHTML = "";
  const card = el("div", "card", $stage);
  el("div", "title", card, title);
  const infoEl = el("div", "info", card, info);
  const timer = el("div", "timer" + (seconds ? "" : " hidden"), $stage);
  const bar = el("i", "", timer);
  // строка прогресса фиксированной высоты: если менять текст подсказки, поле «прыгает» под пальцем
  const status = el("div", "status", $stage, "&nbsp;");
  const board = el("div", "board", $stage);
  const controls = el("div", "", $stage);
  let raf = 0, t0 = 0, onTimeout = null;
  const tick = now => {
    if (!t0) t0 = now;
    const left = 1 - (now - t0) / (seconds * 1000);
    bar.style.transform = `scaleX(${Math.max(0, left)})`;
    if (left <= 0) { if (onTimeout) { const f = onTimeout; onTimeout = null; f(); } return; }
    raf = requestAnimationFrame(tick);
  };
  return {
    card, infoEl, board, controls, status,
    startTimer(fn) { if (!seconds) return; onTimeout = fn; raf = requestAnimationFrame(tick); },
    stop() { cancelAnimationFrame(raf); onTimeout = null; },
  };
}
// Этап-«решение»: возвращает Promise<boolean>
function stageDone(f, resolve) {
  let done = false;
  return async (ok, msg) => {
    if (done) return;
    done = true; f.stop();
    await toast(ok, msg || (ok ? "✅ Готово!" : "❌ Ошибка"));
    resolve(ok);
  };
}

// ================================================================ МИНИ-ИГРЫ
const GAMES = {};

// 🪛 Винты: выкрутить по номерам, каждый — зажать на полсекунды
GAMES.screws = (rnd) => new Promise(resolve => {
  const n = rnd.int(4, 6);
  const f = frame(KINDS.screws, `Выкрути все <b>${n}</b> винтов <b>по порядку номеров</b>. Каждый винт — зажми и держи, пока не выкрутится.`, 30);
  f.board.classList.add("lid");
  const done = stageDone(f, resolve);
  const slots = rnd.shuffle([[18, 18], [50, 14], [82, 18], [16, 50], [84, 50], [18, 82], [50, 86], [82, 82], [50, 50]]).slice(0, n);
  const nums = rnd.shuffle([...Array(n).keys()].map(i => i + 1));
  let next = 1;
  slots.forEach(([x, y], i) => {
    const s = at(el("div", "screw abs", f.board, nums[i]), x, y);
    s.style.setProperty("--rot", rnd.int(0, 180) + "deg");
    let timer = null, angle = 0;
    hold(s, () => {
      if (s.classList.contains("done")) return;
      if (nums[i] !== next) return done(false, `❌ Не тот винт! Нужен №${next}`);
      haptic("light");
      timer = setInterval(() => {
        angle += 40; s.style.setProperty("--rot", angle + "deg");
        if (angle >= 400) {

function pasteGrid(f, size) {
  const chip = el("div", "chip", f.board);
  const grid = el("div", "grid", chip);
  grid.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
  const cells = [];
  for (let i = 0; i < size * size; i++) cells.push(el("div", "cell", grid));
  return { chip, cells };
}
function cellsUnder(e, cells, radius) {
  const p = point(e), out = [];
  for (const c of cells) {
    const r = c.getBoundingClientRect();
    const cx = (r.left + r.right) / 2, cy = (r.top + r.bottom) / 2;
    if (Math.hypot(cx - p.x, cy - p.y) <= radius) out.push(c);
  }
  return out;
}

  cable: ["шлейф", ["FPC-", "FFC-", "LVDS-"]], gpu: ["графический чип", ["CXD", "GFX-", "RSX-"]] };
function variants(rnd, code, count) {
  const out = new Set(), letters = "ABCDEFGHKMPR";
  for (let k = 0; k < 60 && out.size < count; k++) {
    const s = code.split(""), digits = s.map((c, i) => /\d/.test(c) ? i : -1).filter(i => i >= 0);
    const how = rnd.int(0, 2);
    if (how === 0 && digits.length > 1) { const [a, b] = rnd.sample(digits, 2); [s[a], s[b]] = [s[b], s[a]]; }
    else if (how === 1) { const i = s.length - 1 - rnd.int(0, 1); s[i] = rnd.pick(letters.replace(s[i], "").split("")); }
    else { const i = rnd.pick(digits); s[i] = rnd.pick("0123456789".replace(s[i], "").split("")); }
    const v = s.join(""); if (v !== code) out.add(v);
  }
  return [...out];
}

// 🌬 Сушка: держать фен на таком расстоянии, чтобы температура была в зелёной зоне, пока плата не высохнет
GAMES.dry = (rnd) => new Promise(resolve => {
  const lo = rnd.pick([40, 45, 50]), hi = lo + 20;
  const f = frame(KINDS.dry, `Высуши плату феном. Держи температуру <b>${lo}–${hi}°C</b>: двигай ползунок расстояния. Перегреешь — плату поведёт, слишком холодно — не сохнет.`, 30);
  const done = stageDone(f, resolve);
  const big = at(el("div", "bigtemp", f.board, "—"), 50, 30);
  big.style.left = "50%";
  const meter = el("div", "meter", f.board); meter.style.top = "62%";
  const fill = el("i", "", meter); fill.style.width = "100%";
  const label = at(el("div", "abs sub", f.board, "влажность 100%"), 50, 75);
  const slider = el("input", "slider", f.controls);
  slider.type = "range"; slider.min = "2"; slider.max = "40"; slider.value = "40";      // начинаем издалека — холодно
  el("div", "sub center", f.controls, "← ближе к плате · дальше →");
  let wet = 100, over = 0, stopped = false, last = performance.now(), drift = 0;
  const loop = now => {
    if (stopped) return;
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    drift += (rnd.f() - 0.5) * 6 * dt;  drift = Math.max(-5, Math.min(5, drift));   // фен «гуляет» — подстраивайся
    const d = Number(slider.value);
    const temp = Math.round(160 - 3.4 * d + drift);
    big.textContent = temp + "°C";
    big.style.color = temp > hi ? "var(--bad)" : temp >= lo ? "var(--ok)" : "var(--text)";
    if (temp >= lo && temp <= hi) wet -= 9 * dt; else if (temp > hi) { wet -= 12 * dt; over += dt; } else wet -= 1 * dt;
    wet = Math.max(0, wet);
    fill.style.width = wet + "%"; label.textContent = `влажность ${Math.ceil(wet)}% · перегрев ${over.toFixed(1)}/2 с`;
    if (over > 2) { stopped = true; return done(false, "💥 Перегрел — плату повело"); }
    if (wet <= 0) { stopped = true; return done(true, "✅ Плата сухая!"); }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
  f.startTimer(() => { stopped = true; done(false, "⌛ Плата не успела высохнуть"); });
});

// 🎯 Калибровка стика: стик дрейфует, удержи точку в центре 3 секунды
GAMES.calib = (rnd) => new Promise(resolve => {
  const need = 3;
  const f = frame(KINDS.calib, "Стик сам уползает в сторону. Веди пальцем по полю и <b>удерживай точку в зелёном круге</b> — всего 3 секунды.", 20);
  const done = stageDone(f, resolve);
  const ring = at(el("div", "ring abs", f.board), 50, 50);
  const knob = at(el("div", "knob abs", f.board), 50, 50);
  const prog = at(el("div", "abs sub", f.board, ""), 50, 92);
  let ox = 0, oy = 0, px = null, py = null, inside = 0, t = 0, stopped = false, last = performance.now();
  const ax = 18 + rnd.f() * 10, ay = 14 + rnd.f() * 10, sx = 0.6 + rnd.f() * 0.6, sy = 0.5 + rnd.f() * 0.6, ph = rnd.f() * 6;
  f.board.addEventListener("pointerdown", e => { px = e.clientX; py = e.clientY; e.preventDefault(); });
  f.board.addEventListener("pointermove", e => {
    if (px === null) return;
    const w = f.board.clientWidth / 100;
    ox += (e.clientX - px) / w; oy += (e.clientY - py) / w; px = e.clientX; py = e.clientY;
    ox = Math.max(-45, Math.min(45, ox)); oy = Math.max(-45, Math.min(45, oy));
  });
  window.addEventListener("pointerup", () => { px = null; });
  const loop = now => {
    if (stopped) return;
    const dt = Math.min(0.1, (now - last) / 1000); last = now; t += dt;
    const x = 50 + ax * Math.sin(t * sx + ph) + ox, y = 50 + ay * Math.cos(t * sy) + oy;
    at(knob, Math.max(5, Math.min(95, x)), Math.max(5, Math.min(95, y)));
    const inRing = Math.hypot(x - 50, y - 50) < 15;
    ring.classList.toggle("in", inRing);
    if (inRing) inside += dt;
    prog.textContent = `в центре: ${inside.toFixed(1)} / ${need} с`;
    if (inside >= need) { stopped = true; return done(true, "✅ Стик откалиброван!"); }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
  f.startTimer(() => { stopped = true; done(false, "⌛ Не удалось удержать стик"); });
});

// 🧴 Склейка: провести пальцем по всей трещине, не размазывая клей мимо
GAMES.glue = (rnd) => new Promise(resolve => {
  const f = frame(KINDS.glue, "Проведи пальцем <b>вдоль всей трещины</b> — так ляжет клей. Мимо трещины — клей размазывается (можно чуть-чуть).", 20);
  f.board.classList.add("lid");
  const done = stageDone(f, resolve);
  const pts = [];
  let x = 10, y = rnd.int(20, 80);
  for (let i = 0; i <= 12; i++) { pts.push([x, y]); x += 6.6; y = Math.max(10, Math.min(90, y + rnd.int(-14, 14))); }
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 100 100"); svg.setAttribute("class", "crack");
  const crack = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
  crack.setAttribute("points", pts.map(p => p.join(",")).join(" "));
  crack.setAttribute("fill", "none"); crack.setAttribute("stroke", "#111"); crack.setAttribute("stroke-width", "1.6");
  svg.appendChild(crack); f.board.appendChild(svg);
  const covered = new Set();
  let spill = 0, lastSpill = 0;
  const glued = document.createElementNS("http://www.w3.org/2000/svg", "g"); svg.appendChild(glued);
  swipe(f.board, e => {
    const r = f.board.getBoundingClientRect(), p = point(e);
    const gx = (p.x - r.left) / r.width * 100, gy = (p.y - r.top) / r.height * 100;
    // «рядом с трещиной» — по расстоянию до самой линии, а не до её точек
    let near = false;
    for (let i = 1; i < pts.length; i++) {
      const [x1, y1] = pts[i - 1], [x2, y2] = pts[i];
      const len2 = (x2 - x1) ** 2 + (y2 - y1) ** 2;
      const t = Math.max(0, Math.min(1, ((gx - x1) * (x2 - x1) + (gy - y1) * (y2 - y1)) / len2));
      if (Math.hypot(x1 + t * (x2 - x1) - gx, y1 + t * (y2 - y1) - gy) < 6) { near = true; break; }
    }
    pts.forEach((q, i) => { if (Math.hypot(q[0] - gx, q[1] - gy) < 7) { if (!covered.has(i)) {
      covered.add(i); haptic("light");
      const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      c.setAttribute("cx", q[0]); c.setAttribute("cy", q[1]); c.setAttribute("r", "3"); c.setAttribute("fill", "rgba(255,255,255,.7)");
      glued.appendChild(c);
    } } });
    const now = performance.now();
    if (!near && now - lastSpill > 150) { spill++; lastSpill = now; }
    f.status.innerHTML = `Проклеено: <b>${Math.round(100 * covered.size / pts.length)}%</b> · размазано мимо: <b>${spill}</b> из 8`;
    if (spill > 8) return done(false, "❌ Весь корпус в клею");
    if (covered.size === pts.length) done(true, "✅ Трещины не видно!");
  });
  f.startTimer(() => done(false, `⌛ Проклеено только ${Math.round(100 * covered.size / pts.length)}%`));
});

      };
      render();
    });
    st.ordered = Date.now(); st.right = !!order.right; st.item = order.name;
    saveShopState(st);
  }

  // 3) доставка (1–2 минуты, зависит от площадки) — переживает закрытие приложения
  await new Promise(arrived => {
    $stage.innerHTML = "";
    const card = el("div", "card center", $stage);
    el("div", "title", card, "🚚 Заказ оформлен");
    el("div", "info", card, `${esc(st.item || "Деталь")} · ${SHOP_NAMES[st.shop] || ""}`);
    const bar = el("div", "meter", card); bar.style.position = "relative"; bar.style.margin = "14px 0"; bar.style.left = "0";
    const fill = el("i", "", bar);
    const status = el("div", "sub", card, "");
    const stages = ["🧾 Собираем заказ", "📦 Передан в доставку", "🛵 Курьер в пути", "🚪 Курьер у двери"];
    const tick = () => {
      const p = Math.min(1, (Date.now() - st.ordered) / (sh.wait * 1000));
      fill.style.width = p * 100 + "%";
      const left = Math.max(0, Math.ceil(sh.wait - (Date.now() - st.ordered) / 1000));
      status.textContent = `${stages[Math.min(3, Math.floor(p * 4))]} · осталось ${left} с`;
      if (p >= 1) { clearInterval(timer); haptic("ok"); arrived(); }
    };
    const timer = setInterval(tick, 250); tick();
  });
  if (!st.right) return finish(false, "❌ Пришла не та деталь — она не подходит");

  // 4) пайка: включить паяльник, дождаться нагрева, пропаять
  const solderOk = await new Promise(res => {
    const f = frame("🧑‍🏭 Впаиваем деталь", "Сначала <b>включи паяльник</b> и дождись 350°C. Потом зажимай каждый контакт и отпускай в зелёной зоне.", 45);
    const iron = el("div", "iron", f.card, `Паяльник: <span class="switch"><i></i></span> <b class="t">25°C</b>`);
    const sw = iron.querySelector(".switch"), tEl = iron.querySelector(".t");
    let temp = 25, on = false, finished = 0, bad = 0, ended = false;
    const end = (ok, msg) => { if (ended) return; ended = true; clearInterval(heat); f.stop(); toast(ok, msg).then(() => res(ok)); };
    sw.onclick = () => { on = !on; sw.classList.toggle("on", on); haptic("medium"); };
    const heat = setInterval(() => { temp = Math.max(25, Math.min(350, temp + (on ? 18 : -10))); tEl.textContent = Math.round(temp) + "°C"; }, 200);
    const n = 4;
    for (let i = 0; i < n; i++) {
      const p = at(el("div", "pin abs", f.board), 20 + i * 20, 50);
      const pr = el("div", "pr", p), zl = el("div", "zone", p), zh = el("div", "zone", p);
      const low = 0.55 + rnd.f() * 0.1, high = low + 0.25;
      zl.style.bottom = low * 100 + "%"; zh.style.bottom = high * 100 + "%";
      let v = 0, timer = null, state = 0;
      const fin = ok => { clearInterval(timer); state = 2; finished++; p.classList.add(ok ? "good" : "bad"); if (!ok) bad++;
        if (finished === n) end(bad === 0, bad === 0 ? "✅ Деталь впаяна!" : `❌ Плохих контактов: ${bad}`); };
      hold(p, () => {
        if (state) return;
        if (temp < 300) return toast(false, on ? "⏳ Паяльник ещё греется" : "🔌 Сначала включи паяльник");
        state = 1;
        timer = setInterval(() => { v += 0.03; pr.style.height = Math.min(100, v * 100) + "%"; if (v >= 1) fin(false); }, 30);
      }, () => { if (state === 1 && timer) fin(v >= low && v <= high); });
    }
    f.startTimer(() => end(false, "⌛ Не успел впаять"));
  });
  if (!solderOk) return finish(false, "❌ Пайка не удалась");
  if (rnd.int(1, 100) <= sh.defect) return finish(false, "💥 Деталь оказалась бракованной! Не повезло с площадкой");
  finish(true, "✅ Деталь работает!");
});

// ================================================================ ход ремонта
function drawSteps(results, cur) {
  const box = document.getElementById("steps");
  box.innerHTML = "";
  PLAN.forEach((_, i) => el("span", i < results.length ? (results[i] ? "ok" : "bad") : i === cur ? "cur" : "", box));
}

// Результат возвращается в чат с ботом ссылкой t.me/бот?start=wa_<заявка>_<этапы>_<подпись>:
// так работает кнопка прямо в сообщении, и боту не нужен свой сервер.
const BOT = Q.get("bot") || "";
function send(results) {
  if (!/^[A-Za-z0-9_]{3,40}$/.test(BOT) || !/^[0-9a-f]{1,16}$/.test(REP) || !/^[0-9a-f]{24}$/.test(KEY)) return false;
  const shopCode = /^[a-z]$/.test(chosenShop) ? `_${chosenShop}` : "";
  const link = `https://t.me/${BOT}?start=wa_${REP}_${results.join("")}${shopCode}_${KEY}`;
  try {
    if (TG && TG.openTelegramLink) { TG.openTelegramLink(link); setTimeout(() => { try { TG.close(); } catch (e) { /* ok */ } }, 400); }
    else location.href = link;
    return true;
  } catch (e) { return false; }
}

function finalScreen(results) {
  drawSteps(results, -1);
  const ok = results.filter(Boolean).length;
  $stage.innerHTML = "";
  const card = el("div", "card center", $stage);
  el("div", "title", card, ok === results.length ? "🏆 Чистая работа!" : "🔧 Работа закончена");
  el("div", "info", card, `Этапов без ошибок: <b>${ok}</b> из ${results.length}.<br>Каждая ошибка снижает шанс, что консоль оживёт. Итог решит бросок шанса в боте.`);
  const b = el("button", "btn", $stage, "📨 Отправить результат");
  b.onclick = () => {
    b.disabled = true;
    if (!send(results)) { b.disabled = false; el("div", "sub center", $stage, "Не получилось отправить. Открой мастерскую кнопкой в чате с ботом."); }
  };
}

async function main() {
  if (TG) { try { TG.ready(); TG.expand(); } catch (e) { /* ok */ } }
  const sub = document.getElementById("subhdr");
  if (!REP || !KEY || !PLAN.length || PLAN.some(s => !GAMES[s.split(":")[0]])) {
    $stage.innerHTML = "<div class='card'>Открой мастерскую кнопкой «🛠 Открыть мастерскую» в чате с ботом.</div>";
    return;
  }
  document.getElementById("hdr").textContent = "🛠 " + (Q.get("n") || "Ремонт");
  sub.textContent = "Поломка: " + (Q.get("b") || "—");
  const saved = await store.load();
  try { chosenShop = localStorage.getItem(store.key + "_chosen") || ""; } catch (e) { /* ok */ }
  const results = Array.isArray(saved) ? saved.filter(x => x === 0 || x === 1).slice(0, PLAN.length) : [];
  for (let i = results.length; i < PLAN.length; i++) {
    drawSteps(results, i);
    const [kind, arg] = PLAN[i].split(":");
    const ok = await GAMES[kind](makeRnd((SEED * 31 + i * 7919) >>> 0), arg);
    results.push(ok ? 1 : 0);
    store.save(results);
    if (chosenShop) { try { localStorage.setItem(store.key + "_chosen", chosenShop); } catch (e) { /* ok */ } }
  }
  finalScreen(results);
}
main();
</script>
